# Production deploy: pulls the pre-built image from GHCR (see
# .github/workflows/build-and-push.yml) instead of compiling on the VPS.
#
# Usage on the server:
#   cp .env.example .env        # then fill in real secrets — see DEPLOY.md
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec api claude setup-token
#     (prints a token, does NOT save it to disk — copy it into .env as
#     CLAUDE_CODE_OAUTH_TOKEN, then `up -d` again to pick it up)
#
# Set GHCR_OWNER in .env to your GitHub username/org, lowercase.

services:
  api:
    image: ghcr.io/${GHCR_OWNER:-beep242}/coursemaster-api:latest
    restart: unless-stopped
    environment:
      PORT: 8080
      SQLITE_PATH: /app/data/coursemaster.db
      AI_SCRATCH_DIR: /app/data/ai-scratch
      CROSS_APP_JWT_SECRET: ${CROSS_APP_JWT_SECRET:?set CROSS_APP_JWT_SECRET in .env}
      CROSS_APP_JWT_ISSUER: ${CROSS_APP_JWT_ISSUER:-iambeep.com}
      CROSS_APP_JWT_AUDIENCE: ${CROSS_APP_JWT_AUDIENCE:-coursemaster}
      OWNER_EMAIL: ${OWNER_EMAIL:?set OWNER_EMAIL in .env}
      WEB_ALLOWED_ORIGINS: ${WEB_ALLOWED_ORIGINS:-https://coursemaster.iambeep.com}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      # `claude setup-token` prints this directly rather than writing to
      # ~/.claude's credential store (confirmed empirically: the store stayed
      # empty after a completed setup-token run) — it must be supplied as an
      # env var on every container start instead of relying on a volume.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?set CLAUDE_CODE_OAUTH_TOKEN in .env — see DEPLOY.md}
    volumes:
      - coursemaster-data:/app/data
    # NOT loopback-only, unlike the other suite apps' Postgres binding — the
    # shared Caddy container reaches this via `host.docker.internal`, which
    # arrives from the docker bridge network, not 127.0.0.1 (a loopback-only
    # bind caused a silent 502 here — Caddy could reach nothing). Actual
    # internet exposure is blocked by a ufw rule scoped to Caddy's bridge
    # subnets only, mirroring PortFolio's port-4000 rule — see DEPLOY.md.
    ports:
      - "8080:8080"

volumes:
  coursemaster-data:
